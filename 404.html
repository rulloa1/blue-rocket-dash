<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Redirecting...</title>
    <script>
      const l = window.location;
      const path = l.pathname.split('/').slice(0, -1).join('/') + '/';
      const search = l.search;
      const hash = l.hash;
      const newUrl = path + '?' + 'p=' + l.pathname.slice(1) + (search ? '&q=' + search.slice(1) : '') + hash;
      l.replace(newUrl);
    </script>
  </head>
  <body>
    <p>If you are not redirected automatically, follow this <a href="https://rulloa1.github.io/blue-rocket-dash">link to the homepage</a>.</p>
  </body>
</html>
